<!-- src/app/views/dashboard/dashboard.component.html -->
<div class="row">
  <div class="col-sm-6 col-lg-3">
    <div class="card text-white bg-primary">
      <div class="card-body pb-0 d-flex justify-content-between align-items-start">
        <div>
          <div class="text-value-lg">Welcome back,</div>
          <div><strong>{{ user?.name || 'User' }}</strong></div>
        </div>
        <div class="btn-group">
          <button cButton color="primary" size="sm">Profile</button>
        </div>
      </div>
    </div>
  </div>

  <div class="col-sm-6 col-lg-3">
    <div class="card text-white bg-info">
      <div class="card-body pb-0">
        <div class="text-value-lg">{{ stats.tasksToday }}</div>
        <div>Tasks Today</div>
      </div>
    </div>
  </div>

  <div class="col-sm-6 col-lg-3">
    <div class="card text-white bg-success">
      <div class="card-body pb-0">
        <div class="text-value-lg">{{ stats.completedTasks }}</div>
        <div>Completed</div>
      </div>
    </div>
  </div>

  <div class="col-sm-6 col-lg-3">
    <div class="card text-white bg-warning">
      <div class="card-body pb-0">
        <div class="text-value-lg">{{ stats.attendanceThisMonth }}</div>
        <div>Days Present</div>
      </div>
    </div>
  </div>
</div>

<div class="card mt-4">
  <div class="card-header">
    <strong>Quick Actions</strong>
  </div>
  <div class="card-body">
    <div class="row text-center">
      <div class="col-4">
        <button cButton color="primary" routerLink="/attendance" class="w-100">
          Attendance
        </button>
      </div>
      <div class="col-4">
        <button cButton color="primary" routerLink="/tasks" class="w-100">
          My Tasks
        </button>
      </div>
      <div class="col-4">
        <button cButton color="info" class="w-100">
          Reports
        </button>
      </div>
    </div>
  </div>
</div>
